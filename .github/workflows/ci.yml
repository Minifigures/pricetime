name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        if: matrix.compiler == 'clang++'
        run: sudo apt-get update && sudo apt-get install -y clang
      # -march=native is unsafe on shared CI runners, so the portable
      # baseline is used here. The published benchmark numbers come from
      # `make bench` on a known machine, not from CI.
      - name: Build and test
        run: make test CXX=${{ matrix.compiler }} OPT="-O2 -DNDEBUG"

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AddressSanitizer + UndefinedBehaviorSanitizer
        run: make asan

  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This job exists because it caught a real one: the seqlock's payload was
      # a plain struct, which is a data race under the C++ memory model even
      # though the version-counter protocol makes it safe on x86 in practice.
      - name: ThreadSanitizer
        run: make tsan

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Proves the harness still runs. CI numbers are noisy on a shared runner
      # and are NOT the numbers in the README, which come from a stated
      # machine. The small workload also keeps the job inside the runner's
      # memory: the full run pre-generates ~100 MB of flow per regime and was
      # being OOM-killed.
      - name: Benchmark smoke
        env:
          PRICETIME_BENCH_OPS: "20000"
        run: |
          make bench CXX=g++ OPT="-O2 -DNDEBUG"
          make shardbench CXX=g++ OPT="-O2 -DNDEBUG"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # src/wasm_main.cpp is compiled by no other job, so a break in it used to
      # ship silently: the committed .wasm would simply stay stale and the page
      # would keep serving the previous build. This compiles it for real.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.7
          actions-cache-folder: emsdk-cache
      - name: Build the engine to WebAssembly
        run: |
          em++ -O3 -std=c++20 -Iinclude \
            src/wasm_main.cpp src/book.cpp src/reference_book.cpp \
            src/surveillance.cpp \
            -o /tmp/pricetime.js \
            -sEXPORTED_RUNTIME_METHODS=ccall,cwrap \
            -sMODULARIZE -sEXPORT_NAME=PricetimeModule -sALLOW_MEMORY_GROWTH
      # A byte-compare against the committed artifact is not used here: emcc
      # output is not reproducible across toolchain versions or build paths,
      # so it would go red for reasons that have nothing to do with the code.
      # This job's job is to prove src/wasm_main.cpp still compiles.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Build
        working-directory: web
        run: npm run build
